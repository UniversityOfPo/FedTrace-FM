# Reviewer-response Stage B, smoke test S0a (GPU, ~minutes; NOT a scientific run): the UNMODIFIED NDSS runner
# on a 3-round version of EXP_016 so that the attack path is exercised (attack_start_round 1):
#   python -m src.experiments.run_federated_cifar100 --config configs/rev/S0a_smoke_ndss.yaml
# S0b (configs/rev/S0b_smoke_logged.rev.yaml) runs the same config through the rev entry point with logging;
# python -m src.rev.compare_runs --preset S0b-vs-S0a must then report no difference.
# Below the separator: a copy of configs/cifar100_fedavg_dirichlet_a01_gaussian_attack_client002_round20_seed123.yaml
# with experiment_id, experiment_name, output_dir, checkpoint_dir, communication_rounds and attack_start_round changed.
# ----------------------------------------------------------------------------------------------
experiment_id: REV_S0_SMOKE
experiment_name: rev_s0_smoke_exp016_3rounds
dataset_config: configs/cifar100_data.yaml
output_dir: results_rev/S0a_smoke_ndss
checkpoint_dir: checkpoints_rev/S0a_smoke_ndss

num_clients: 5
clients_per_round: 5
minimum_updates: 5
communication_rounds: 3
local_epochs: 1
batch_size: 32
num_workers: 2

model: resnet18_cifar
num_classes: 100

optimizer: sgd
learning_rate: 0.01
momentum: 0.9
weight_decay: 0.0005
scheduler: none
mixed_precision: true

aggregation: fedavg
partition: dirichlet
dirichlet_alpha: 0.1
validation_fraction: 0.1
evaluate_every: 1
checkpoint_every: 1

seed: 123
device: auto
fail_round_on_client_error: true
continue_after_failed_round: false

attack_type: gaussian_update_noise
malicious_client_id: client_002
attack_start_round: 1
attack_strength_rho: 1.0
