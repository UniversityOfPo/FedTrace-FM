# EXP_024 -- Multi-Krum external baseline, first DIRECTIONAL attacked run:
# norm-preserving directional malicious-update attack, Non-IID (Dirichlet,
# alpha=0.1) CIFAR-100, 50 communication rounds, seed 123.
#
# Strict single-variable replication of EXP_018
# (configs/cifar100_fedavg_dirichlet_a01_direction_attack_client002_round20_seed123.yaml),
# per research_plans/MULTIKRUM_EXTERNAL_BASELINE_IMPLEMENTATION_PLAN.md
# Section 8 and analysis/MULTIKRUM_GAUSSIAN_CROSS_SEED_SYNTHESIS.md Part 12
# (next-gate decision A -- Gaussian Multi-Krum branch validated across both
# seeds; proceed to the Multi-Krum analog of EXP_018): the ONLY scientific
# value changed below relative to EXP_018 is `aggregation` (fedavg ->
# multikrum). The directional attack itself (attack_type,
# malicious_client_id, attack_start_round, directional_target_cosine) is
# copied unchanged, byte-for-byte, from EXP_018 -- not re-derived, not
# re-tuned. `attack_strength_rho` is a Gaussian-attack-specific field,
# inert for this attack type; EXP_018 leaves it entirely absent (per its
# own config comment) rather than setting it to an inert value, and this
# config does the same -- introducing the field, even set to 0.0, would be
# an unnecessary, non-byte-identical change relative to EXP_018 that this
# plan explicitly avoids. Multi-Krum's own frozen parameters (f=1,
# m=n-f=4, neighbors_used=n-f-2=2, tie-breaking, weighting, buffer
# handling) and the pre-registered P_krum=3 rejection proxy are unchanged
# from EXP_020/EXP_022/EXP_023 and are NOT altered based on the Gaussian
# Multi-Krum findings (pre-attack honest-heterogeneity rejection, an
# instantaneous round-20 rejection-target switch, 30/30 post-attack
# rejection of client_002, a full-run rejection-proxy misattribution, and
# attacked Multi-Krum underperforming attacked FedAvg, replicated at both
# Gaussian seeds) or any expectation about whether the directional attack
# family will show the same pattern -- they are fixed inside
# src/federated/aggregation/multikrum.py and
# src/experiments/run_federated_cifar100.py's `_MULTIKRUM_F` constant and
# are deliberately NOT YAML fields, so they are not set here. Whether
# Multi-Krum's raw Euclidean-distance metric -- which the Gaussian-family
# analysis found separates that attack primarily via its magnitude
# inflation -- can also separate a norm-preserving (magnitude-unchanged,
# direction-only) attacker is an open question this run exists to test,
# not a predicted or assumed outcome.
#
# This run is directly comparable to two already-existing runs, each along
# a different single axis:
#   - EXP_018 (attacked FedAvg, directional, seed 123): the paired
#     attacked baseline -- isolates the effect of aggregation strategy
#     under an identical attack.
#   - EXP_020 (clean Multi-Krum, seed 123): the paired clean control --
#     isolates the effect of the attack itself under identical
#     aggregation.
#
# experiment_id, experiment_name, output_dir, and checkpoint_dir were also
# changed, but only so this run gets its own identity and output/checkpoint
# location instead of overwriting EXP_018's or EXP_020's frozen results --
# they are not scientific variables. Every other field is copied unchanged,
# byte-for-byte, from EXP_018's config.
experiment_id: EXP_024
experiment_name: cifar100_multikrum_dirichlet_a01_direction_attack_client002_round20_seed123
dataset_config: configs/cifar100_data.yaml
output_dir: results/federated/cifar100_multikrum_dirichlet_a01_direction_attack_client002_round20_seed123
checkpoint_dir: checkpoints/federated/cifar100_multikrum_dirichlet_a01_direction_attack_client002_round20_seed123

num_clients: 5
clients_per_round: 5
minimum_updates: 5
communication_rounds: 50
local_epochs: 1
batch_size: 32
num_workers: 2

model: resnet18_cifar
num_classes: 100

optimizer: sgd
learning_rate: 0.01
momentum: 0.9
weight_decay: 0.0005
scheduler: none
mixed_precision: true

aggregation: multikrum
partition: dirichlet
dirichlet_alpha: 0.1
validation_fraction: 0.1
evaluate_every: 1
checkpoint_every: 1

seed: 123
device: auto
fail_round_on_client_error: true
continue_after_failed_round: false

attack_type: norm_preserving_directional
malicious_client_id: client_002
attack_start_round: 20
directional_target_cosine: 0.0
