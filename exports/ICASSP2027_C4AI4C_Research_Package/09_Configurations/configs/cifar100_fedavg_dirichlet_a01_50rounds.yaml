# EXP_007 -- Non-IID (Dirichlet, alpha=0.1) FedAvg CIFAR-100, 50
# communication rounds.
#
# Controlled single-variable follow-up to EXP_006
# (configs/cifar100_fedavg_dirichlet_a05_50rounds.yaml), per
# analysis/EXP_006_Dirichlet_A05_Analysis.md (Sections 10-12) and
# research_plans/PHASE4_RESEARCH_STRATEGY.md (Section 6): the ONLY value
# changed below is `dirichlet_alpha` (0.5 -> 0.1) -- a stronger
# (lower-alpha) heterogeneity setting than EXP_006, testing whether a more
# severe per-client class-distribution skew produces a correspondingly
# larger accuracy gap relative to EXP_004's IID reference. experiment_id,
# experiment_name, output_dir, and checkpoint_dir were also changed, but
# only so this run gets its own identity and output/checkpoint location
# instead of overwriting EXP_006's frozen results -- they are not
# scientific variables. Every other field is copied unchanged,
# byte-for-byte, from EXP_006's config.
experiment_id: EXP_007
experiment_name: cifar100_fedavg_dirichlet_a01_50rounds
dataset_config: configs/cifar100_data.yaml
output_dir: results/federated/cifar100_fedavg_dirichlet_a01_50rounds
checkpoint_dir: checkpoints/federated/cifar100_fedavg_dirichlet_a01_50rounds

num_clients: 5
clients_per_round: 5
minimum_updates: 5
communication_rounds: 50
local_epochs: 1
batch_size: 32
num_workers: 2

model: resnet18_cifar
num_classes: 100

optimizer: sgd
learning_rate: 0.01
momentum: 0.9
weight_decay: 0.0005
scheduler: none
mixed_precision: true

aggregation: fedavg
partition: dirichlet
dirichlet_alpha: 0.1
validation_fraction: 0.1
evaluate_every: 1
checkpoint_every: 1

seed: 42
device: auto
fail_round_on_client_error: true
continue_after_failed_round: false
