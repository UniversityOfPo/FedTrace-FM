# EXP_020 -- Multi-Krum external baseline, clean control 1 of 2: Non-IID
# (Dirichlet, alpha=0.1) CIFAR-100, 50 communication rounds, seed 123, NO
# attack.
#
# Strict single-variable replication of EXP_008
# (configs/cifar100_fedavg_dirichlet_a01_seed123_50rounds.yaml), per
# research_plans/MULTIKRUM_EXTERNAL_BASELINE_IMPLEMENTATION_PLAN.md
# Section 7 and analysis/MULTIKRUM_IMPLEMENTATION_VERIFICATION.md Section
# 9: the ONLY scientific value changed below is `aggregation` (fedavg ->
# multikrum). This is a CLEAN control -- no attack_type,
# malicious_client_id, attack_start_round, attack_strength_rho, or
# directional_target_cosine field is present. Its purpose is (1) to
# measure the clean-performance cost of Multi-Krum's robust aggregation
# under this project's already-documented strong Non-IID heterogeneity,
# relative to EXP_008's honest FedAvg baseline, (2) to verify the
# multikrum_diagnostics.csv integration end-to-end on a real run, and (3)
# to observe, with no attacker present at all, whether Multi-Krum
# systematically selects or rejects any particular honest client -- see
# the implementation plan Section 6's pre-registered Non-IID fairness
# risk. Multi-Krum's own parameters (f=1, m=n-f=4, neighbors_used=n-f-2=2)
# are fixed inside src/federated/aggregation/multikrum.py and
# src/experiments/run_federated_cifar100.py's `_MULTIKRUM_F` constant --
# they are deliberately NOT YAML fields and are not set here.
# experiment_id, experiment_name, output_dir, and checkpoint_dir were also
# changed, but only so this run gets its own identity and output/checkpoint
# location instead of overwriting EXP_008's frozen results -- they are not
# scientific variables. Every other field is copied unchanged, byte-for-byte,
# from EXP_008's config.
experiment_id: EXP_020
experiment_name: cifar100_multikrum_dirichlet_a01_seed123_50rounds
dataset_config: configs/cifar100_data.yaml
output_dir: results/federated/cifar100_multikrum_dirichlet_a01_seed123_50rounds
checkpoint_dir: checkpoints/federated/cifar100_multikrum_dirichlet_a01_seed123_50rounds

num_clients: 5
clients_per_round: 5
minimum_updates: 5
communication_rounds: 50
local_epochs: 1
batch_size: 32
num_workers: 2

model: resnet18_cifar
num_classes: 100

optimizer: sgd
learning_rate: 0.01
momentum: 0.9
weight_decay: 0.0005
scheduler: none
mixed_precision: true

aggregation: multikrum
partition: dirichlet
dirichlet_alpha: 0.1
validation_fraction: 0.1
evaluate_every: 1
checkpoint_every: 1

seed: 123
device: auto
fail_round_on_client_error: true
continue_after_failed_round: false
