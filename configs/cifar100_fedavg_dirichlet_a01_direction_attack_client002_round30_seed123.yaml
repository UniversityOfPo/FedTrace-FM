# EXP_027 -- FedTrace attack-onset generalization, run 1 of 1 (this task):
# norm-preserving directional malicious-update attack, Dirichlet
# (alpha=0.1) FedAvg CIFAR-100, 50 communication rounds, seed 123 --
# identical to EXP_018 except the attack onset round.
#
# Motivation (analysis/ICML_ICLR_EVIDENCE_GAP_AUDIT.md Part 6/Part 17;
# analysis/FEDTRACE_GENERALIZATION_GATE_STATUS.md): every attack-bearing
# run through EXP_026 uses the identical attack onset (round 20).
# EXP_026 already closed/narrowed the attacker-identity axis of the
# audit's single essential remaining gap (client_004, round 20); this
# config addresses the other, still fully open axis -- onset round --
# independently, by anchoring to EXP_018 (not EXP_026), so the identity
# and onset axes are each varied one at a time rather than compounded in
# a single run.
#
# Strict single-variable-change design against EXP_018
# (configs/cifar100_fedavg_dirichlet_a01_direction_attack_client002_round20_seed123.yaml):
# the base training/federated configuration below is copied byte-for-byte
# from EXP_018, which was itself copied byte-for-byte from EXP_008
# (configs/cifar100_fedavg_dirichlet_a01_seed123_50rounds.yaml). The ONLY
# scientific value changed relative to EXP_018 is `attack_start_round`,
# changed from `20` to `30`. `malicious_client_id` remains `client_002`
# (EXP_018's own value, deliberately NOT changed to EXP_026's client_004,
# so this run tests onset generalization alone, not onset-and-identity
# jointly). Attack family and severity are held fixed at EXP_018's own
# values (`attack_type: norm_preserving_directional`,
# `directional_target_cosine: 0.0`). `attack_strength_rho` remains
# deliberately absent, exactly as in EXP_018, for the same reason
# documented in EXP_018's own config comment (it is a Gaussian-attack-
# specific field, inert for this attack type). experiment_id,
# experiment_name, output_dir, and checkpoint_dir were also changed, but
# only so this run gets its own identity and output/checkpoint location
# instead of overwriting EXP_018's frozen results -- they are not
# scientific variables. Every other field is copied unchanged,
# byte-for-byte, from EXP_018's config.
experiment_id: EXP_027
experiment_name: cifar100_fedavg_dirichlet_a01_direction_attack_client002_round30_seed123
dataset_config: configs/cifar100_data.yaml
output_dir: results/federated/cifar100_fedavg_dirichlet_a01_direction_attack_client002_round30_seed123
checkpoint_dir: checkpoints/federated/cifar100_fedavg_dirichlet_a01_direction_attack_client002_round30_seed123

num_clients: 5
clients_per_round: 5
minimum_updates: 5
communication_rounds: 50
local_epochs: 1
batch_size: 32
num_workers: 2

model: resnet18_cifar
num_classes: 100

optimizer: sgd
learning_rate: 0.01
momentum: 0.9
weight_decay: 0.0005
scheduler: none
mixed_precision: true

aggregation: fedavg
partition: dirichlet
dirichlet_alpha: 0.1
validation_fraction: 0.1
evaluate_every: 1
checkpoint_every: 1

seed: 123
device: auto
fail_round_on_client_error: true
continue_after_failed_round: false

attack_type: norm_preserving_directional
malicious_client_id: client_002
attack_start_round: 30
directional_target_cosine: 0.0
