# EXP_025 -- Multi-Krum external baseline, second DIRECTIONAL attacked run:
# norm-preserving directional malicious-update attack, Non-IID (Dirichlet,
# alpha=0.1) CIFAR-100, 50 communication rounds, seed 2026.
#
# Strict single-variable replication of EXP_019
# (configs/cifar100_fedavg_dirichlet_a01_direction_attack_client002_round20_seed2026.yaml),
# per research_plans/MULTIKRUM_EXTERNAL_BASELINE_IMPLEMENTATION_PLAN.md
# Section 8 and analysis/EXP_024_MULTIKRUM_DIRECTIONAL_SEED123_ANALYSIS.md
# Section 14 (next-gate decision A -- EXP_024 technically valid; proceed
# to the Multi-Krum analog of EXP_019, to test whether EXP_024's seed-123
# directional findings replicate at unseen seed 2026): the ONLY scientific
# value changed below relative to EXP_019 is `aggregation` (fedavg ->
# multikrum). The directional attack itself (attack_type,
# malicious_client_id, attack_start_round, directional_target_cosine) is
# copied unchanged, byte-for-byte, from EXP_019 -- not re-derived, not
# re-tuned. `attack_strength_rho` is a Gaussian-attack-specific field,
# inert for this attack type; EXP_019 leaves it entirely absent (per its
# own config comment) rather than setting it to an inert value, and this
# config does the same. Multi-Krum's own frozen parameters (f=1, m=n-f=4,
# neighbors_used=n-f-2=2, tie-breaking, weighting, buffer handling) and the
# pre-registered P_krum=3 rejection proxy are unchanged from
# EXP_020/EXP_021/EXP_022/EXP_023/EXP_024 and are NOT altered based on
# EXP_024's seed-123 directional findings (client_002 rejected 0/30
# post-attack rounds; client_004 rejected 30/30 post-attack rounds; no
# rejection-regime switch; the full-run P_krum=3 proxy misattributing
# client_004 with client_002 never confirmed; substantial directional
# utility degradation relative to both clean Multi-Krum and attacked
# FedAvg; and a stark 100%-vs-0% contrast against the Gaussian family at
# the same seed) or any expectation about whether these findings will
# replicate at seed 2026 -- they are fixed inside
# src/federated/aggregation/multikrum.py and
# src/experiments/run_federated_cifar100.py's `_MULTIKRUM_F` constant and
# are deliberately NOT YAML fields, so they are not set here. Whether
# EXP_024's findings (complete attacker evasion, no regime switch, a
# misattributed honest client, and substantial utility loss) replicate at
# this second seed, partially replicate, or do not replicate is an open
# question this run exists to test, not a predicted or assumed outcome.
#
# This run is directly comparable to two already-existing runs, each along
# a different single axis:
#   - EXP_019 (attacked FedAvg, directional, seed 2026): the paired
#     attacked baseline -- isolates the effect of aggregation strategy
#     under an identical attack.
#   - EXP_021 (clean Multi-Krum, seed 2026): the paired clean control --
#     isolates the effect of the attack itself under identical
#     aggregation.
#
# experiment_id, experiment_name, output_dir, and checkpoint_dir were also
# changed, but only so this run gets its own identity and output/checkpoint
# location instead of overwriting EXP_019's or EXP_021's frozen results --
# they are not scientific variables. Every other field is copied unchanged,
# byte-for-byte, from EXP_019's config.
experiment_id: EXP_025
experiment_name: cifar100_multikrum_dirichlet_a01_direction_attack_client002_round20_seed2026
dataset_config: configs/cifar100_data.yaml
output_dir: results/federated/cifar100_multikrum_dirichlet_a01_direction_attack_client002_round20_seed2026
checkpoint_dir: checkpoints/federated/cifar100_multikrum_dirichlet_a01_direction_attack_client002_round20_seed2026

num_clients: 5
clients_per_round: 5
minimum_updates: 5
communication_rounds: 50
local_epochs: 1
batch_size: 32
num_workers: 2

model: resnet18_cifar
num_classes: 100

optimizer: sgd
learning_rate: 0.01
momentum: 0.9
weight_decay: 0.0005
scheduler: none
mixed_precision: true

aggregation: multikrum
partition: dirichlet
dirichlet_alpha: 0.1
validation_fraction: 0.1
evaluate_every: 1
checkpoint_every: 1

seed: 2026
device: auto
fail_round_on_client_error: true
continue_after_failed_round: false

attack_type: norm_preserving_directional
malicious_client_id: client_002
attack_start_round: 20
directional_target_cosine: 0.0
