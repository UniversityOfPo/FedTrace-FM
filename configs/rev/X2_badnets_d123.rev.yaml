# Stage C pilot, matched pair 1 (development seed 123), BadNets arm. NOT run until the PI approves GPU execution.
#   python -m src.rev.run_rev_experiment --config configs/rev/X2_badnets_d123.rev.yaml
# Same base config as X1_clean_d123; the only difference is data poisoning of client_002 from round 20:
# 50 % of its non-target-class training samples get a 3x3 white bottom-right patch (applied after the training
# augmentation, in normalised space) and label 0. Attack parameters are PROVISIONAL (development seed only).
# Hypotheses: H-03 (attack effective and attributed), candidate A/B/C evaluation on its trace (CPU).
rev_schema: fedtrace-rev-run-v1
run_id: X2_badnets_d123
stage: C-pilot
base_config: configs/cifar100_fedavg_dirichlet_a01_seed123_50rounds.yaml
output_overrides:
  output_dir: results_rev/X2_badnets_d123
  checkpoint_dir: checkpoints_rev/X2_badnets_d123
update_log:
  enabled: true
  directory: logs_rev/X2_badnets_d123/update_log
  pre_transform_clients: []
  max_gib: 14
  reserve_gib: 100
rev_attack:
  type: backdoor
  provisional: true
  malicious_client_id: client_002
  onset_round: 20
  t_ref: 20
  backdoor:
    target_class: 0
    poison_fraction: 0.5
    trigger_size: 3
