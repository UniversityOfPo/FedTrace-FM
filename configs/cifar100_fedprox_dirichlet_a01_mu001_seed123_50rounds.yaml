# EXP_011 -- FedProx under strong Non-IID heterogeneity (Dirichlet,
# alpha=0.1), mu=0.01, 50 communication rounds, seed 123.
#
# Strict single-variable replication of EXP_010
# (configs/cifar100_fedprox_dirichlet_a01_mu001_50rounds.yaml), per
# research_plans/EXP_010_FedProx_Strong_NonIID_Plan.md Section 3 (the
# pre-registered 42/123/2026 paired-seed design) and
# analysis/EXP_010_FedProx_Seed42_Analysis.md Section 8: the ONLY value
# changed below is `seed` (42 -> 123). This is the FedProx counterpart of
# EXP_008 (configs/cifar100_fedavg_dirichlet_a01_seed123_50rounds.yaml) --
# same seed, same Dirichlet(alpha=0.1) partition realization, same strong
# Non-IID protocol -- so that EXP_008 vs. EXP_011 is a valid paired
# comparison, exactly as EXP_007 vs. EXP_010 was for seed 42.
# `local_training_method: fedprox` and `fedprox_mu: 0.01` are unchanged
# from EXP_010; `aggregation` remains `fedavg` unchanged, since FedProx
# modifies only the client-side local objective, not the server-side
# aggregation strategy (plan Section 8). experiment_id, experiment_name,
# output_dir, and checkpoint_dir were also changed, but only so this run
# gets its own identity and output/checkpoint location instead of
# overwriting EXP_010's frozen results -- they are not scientific
# variables. Every other field is copied unchanged, byte-for-byte, from
# EXP_010's config.
experiment_id: EXP_011
experiment_name: cifar100_fedprox_dirichlet_a01_mu001_seed123_50rounds
dataset_config: configs/cifar100_data.yaml
output_dir: results/federated/cifar100_fedprox_dirichlet_a01_mu001_seed123_50rounds
checkpoint_dir: checkpoints/federated/cifar100_fedprox_dirichlet_a01_mu001_seed123_50rounds

num_clients: 5
clients_per_round: 5
minimum_updates: 5
communication_rounds: 50
local_epochs: 1
batch_size: 32
num_workers: 2

model: resnet18_cifar
num_classes: 100

optimizer: sgd
learning_rate: 0.01
momentum: 0.9
weight_decay: 0.0005
scheduler: none
mixed_precision: true
local_training_method: fedprox
fedprox_mu: 0.01

aggregation: fedavg
partition: dirichlet
dirichlet_alpha: 0.1
validation_fraction: 0.1
evaluate_every: 1
checkpoint_every: 1

seed: 123
device: auto
fail_round_on_client_error: true
continue_after_failed_round: false
