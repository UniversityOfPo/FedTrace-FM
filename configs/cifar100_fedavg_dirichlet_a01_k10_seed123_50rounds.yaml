# Protocol 37 (C4AI4C extension) K = 10 base config, seed 123. Copied from configs/cifar100_fedavg_dirichlet_a01_seed123_50rounds.yaml;
# only experiment identity, output paths and num_clients / clients_per_round / minimum_updates (5 -> 10) differ.
# EXP_008 -- Non-IID (Dirichlet, alpha=0.1) FedAvg CIFAR-100, 50
# communication rounds, seed replication.
#
# Strict single-variable replication of EXP_007
# (configs/cifar100_fedavg_dirichlet_a01_50rounds.yaml), per
# analysis/EXP_007_Dirichlet_A01_Analysis.md (Section 9): the ONLY value
# changed below is `seed` (42 -> 123), to test whether EXP_007's
# moderate-to-severe degradation and its reversal of EXP_004's advantage
# over the centralized EXP_001 baseline are reproducible under a
# different random seed, or specific to the one partition/initialization
# drawn at seed 42. experiment_id, experiment_name, output_dir, and
# checkpoint_dir were also changed, but only so this run gets its own
# identity and output/checkpoint location instead of overwriting
# EXP_007's frozen results -- they are not scientific variables. Every
# other field is copied unchanged, byte-for-byte, from EXP_007's config.
experiment_id: EXP_008
experiment_name: cifar100_fedavg_dirichlet_a01_k10_seed123_50rounds
dataset_config: configs/cifar100_data.yaml
output_dir: results/federated/cifar100_fedavg_dirichlet_a01_k10_seed123_50rounds
checkpoint_dir: checkpoints/federated/cifar100_fedavg_dirichlet_a01_k10_seed123_50rounds

num_clients: 10
clients_per_round: 10
minimum_updates: 10
communication_rounds: 50
local_epochs: 1
batch_size: 32
num_workers: 2

model: resnet18_cifar
num_classes: 100

optimizer: sgd
learning_rate: 0.01
momentum: 0.9
weight_decay: 0.0005
scheduler: none
mixed_precision: true

aggregation: fedavg
partition: dirichlet
dirichlet_alpha: 0.1
validation_fraction: 0.1
evaluate_every: 1
checkpoint_every: 1

seed: 123
device: auto
fail_round_on_client_error: true
continue_after_failed_round: false
