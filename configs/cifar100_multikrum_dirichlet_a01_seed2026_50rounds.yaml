# EXP_021 -- Multi-Krum external baseline, clean control 2 of 2: Non-IID
# (Dirichlet, alpha=0.1) CIFAR-100, 50 communication rounds, seed 2026, NO
# attack.
#
# Strict single-variable replication of EXP_009
# (configs/cifar100_fedavg_dirichlet_a01_seed2026_50rounds.yaml), per
# research_plans/MULTIKRUM_EXTERNAL_BASELINE_IMPLEMENTATION_PLAN.md
# Section 7 and analysis/EXP_020_CLEAN_MULTIKRUM_SEED123_ANALYSIS.md
# Section 9 (EXP_021 gate: A -- proceed): the ONLY scientific value changed
# below is `aggregation` (fedavg -> multikrum). This is a CLEAN control --
# no attack_type, malicious_client_id, attack_start_round,
# attack_strength_rho, or directional_target_cosine field is present. Its
# purpose is to test, at the second already-validated seed, whether
# EXP_020's seed-123 findings (a ~6.8-9.1pp clean-performance cost, and a
# persistent Multi-Krum rejection-proxy false positive against one honest
# client under this project's strong Non-IID heterogeneity) replicate
# under a different Dirichlet(alpha=0.1) partition realization, or are
# specific to the one partition/initialization drawn at seed 123. Neither
# outcome is predicted here, and Multi-Krum's frozen parameters (f=1,
# m=n-f=4, neighbors_used=n-f-2=2, tie-breaking, weighting, buffer
# handling, and the pre-registered P_krum=3 rejection proxy) are not
# altered regardless of what EXP_020 showed -- they are fixed inside
# src/federated/aggregation/multikrum.py and
# src/experiments/run_federated_cifar100.py's `_MULTIKRUM_F` constant and
# are deliberately NOT YAML fields, so they are not set here.
# experiment_id, experiment_name, output_dir, and checkpoint_dir were also
# changed, but only so this run gets its own identity and output/checkpoint
# location instead of overwriting EXP_009's frozen results -- they are not
# scientific variables. Every other field is copied unchanged, byte-for-byte,
# from EXP_009's config.
experiment_id: EXP_021
experiment_name: cifar100_multikrum_dirichlet_a01_seed2026_50rounds
dataset_config: configs/cifar100_data.yaml
output_dir: results/federated/cifar100_multikrum_dirichlet_a01_seed2026_50rounds
checkpoint_dir: checkpoints/federated/cifar100_multikrum_dirichlet_a01_seed2026_50rounds

num_clients: 5
clients_per_round: 5
minimum_updates: 5
communication_rounds: 50
local_epochs: 1
batch_size: 32
num_workers: 2

model: resnet18_cifar
num_classes: 100

optimizer: sgd
learning_rate: 0.01
momentum: 0.9
weight_decay: 0.0005
scheduler: none
mixed_precision: true

aggregation: multikrum
partition: dirichlet
dirichlet_alpha: 0.1
validation_fraction: 0.1
evaluate_every: 1
checkpoint_every: 1

seed: 2026
device: auto
fail_round_on_client_error: true
continue_after_failed_round: false
