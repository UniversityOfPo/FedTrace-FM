# EXP_014 -- Malicious-client Gaussian update-noise attack pilot, Dirichlet
# (alpha=0.1) FedAvg CIFAR-100, 50 communication rounds, seed 42.
#
# Strict paired single-variable attack experiment against EXP_007
# (configs/cifar100_fedavg_dirichlet_a01_50rounds.yaml), per
# research_plans/PHASE5_Malicious_Client_Traceability_Plan.md Sections
# 4-8 and 15: the ONLY scientific value changed below is the presence of
# the attack itself (`attack_type: gaussian_update_noise` plus its four
# required companion fields). `local_training_method`/`fedprox_mu` are
# NOT introduced -- this is a FedAvg-only pairing with EXP_007, not a
# FedProx experiment (see plan Section 4: FedProx is a separate,
# already-completed track, unrelated to this attack study).
# `malicious_client_id: client_002` is the fixed first malicious client
# (plan Section 6: smallest cross-seed sample-count spread of any client,
# keeping its FedAvg aggregation weight comparable across the eventual
# 42/123/2026 paired seeds). `attack_start_round: 20` is the fixed,
# pre-registered delayed onset (plan Section 7: 20 honest rounds as a
# clean pre-attack reference, 30 remaining rounds to observe detection and
# consequences). `attack_strength_rho: 1.0` is the frozen first strength
# value (plan Section 5: injected noise's expected L2 norm equals the
# honest update's own L2 norm). experiment_id, experiment_name,
# output_dir, and checkpoint_dir were also changed, but only so this run
# gets its own identity and output/checkpoint location instead of
# overwriting EXP_007's frozen results -- they are not scientific
# variables. Every other field is copied unchanged, byte-for-byte, from
# EXP_007's config.
experiment_id: EXP_014
experiment_name: cifar100_fedavg_dirichlet_a01_gaussian_attack_client002_round20_seed42
dataset_config: configs/cifar100_data.yaml
output_dir: results/federated/cifar100_fedavg_dirichlet_a01_gaussian_attack_client002_round20_seed42
checkpoint_dir: checkpoints/federated/cifar100_fedavg_dirichlet_a01_gaussian_attack_client002_round20_seed42

num_clients: 5
clients_per_round: 5
minimum_updates: 5
communication_rounds: 50
local_epochs: 1
batch_size: 32
num_workers: 2

model: resnet18_cifar
num_classes: 100

optimizer: sgd
learning_rate: 0.01
momentum: 0.9
weight_decay: 0.0005
scheduler: none
mixed_precision: true

aggregation: fedavg
partition: dirichlet
dirichlet_alpha: 0.1
validation_fraction: 0.1
evaluate_every: 1
checkpoint_every: 1

seed: 42
device: auto
fail_round_on_client_error: true
continue_after_failed_round: false

attack_type: gaussian_update_noise
malicious_client_id: client_002
attack_start_round: 20
attack_strength_rho: 1.0
