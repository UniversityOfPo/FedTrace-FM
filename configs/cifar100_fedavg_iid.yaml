# Full configuration for the IID FedAvg CIFAR-100 experiment (Sprint 4.1).
experiment_id: EXP_002
experiment_name: cifar100_fedavg_iid
dataset_config: configs/cifar100_data.yaml
output_dir: results/federated/cifar100_fedavg_iid
checkpoint_dir: checkpoints/federated/cifar100_fedavg_iid

num_clients: 5
clients_per_round: 5
minimum_updates: 5
communication_rounds: 10
local_epochs: 1
batch_size: 32
num_workers: 2

model: resnet18_cifar
num_classes: 100

optimizer: sgd
learning_rate: 0.01
momentum: 0.9
weight_decay: 0.0005
scheduler: none
mixed_precision: true

aggregation: fedavg
partition: iid
validation_fraction: 0.1
evaluate_every: 1
checkpoint_every: 1

seed: 42
device: auto
fail_round_on_client_error: true
continue_after_failed_round: false
