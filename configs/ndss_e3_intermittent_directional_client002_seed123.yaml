# NDSS E3-B -- intermittent norm-preserving directional attack, seed 123.
#
# NEW experiment. Does NOT modify any existing config, the frozen FedTrace
# detector (src/analysis/fedtrace_detector.py, untouched), or any existing
# result file (E1, E2, or the primary-validation series). Base
# training/federated configuration copied byte-for-byte from the project's
# existing 5-client directional-attack convention
# (configs/cifar100_fedavg_dirichlet_a01_direction_attack_client002_round20_seed123.yaml,
# i.e. EXP_018), with output_dir/checkpoint_dir redirected to a new
# results_ndss/E3_intermittent/ tree and the NEW `attack_active_windows`
# field added (src/attacks/traceability.py::AttackConfig,
# src/experiments/run_federated_cifar100.py::FederatedExperimentConfig).
#
# client_002 is malicious ONLY during rounds 20-24, 30-34, and 40-44
# (inclusive), and behaves exactly as an honest client during every other
# round, including rounds 25-29, 35-39, and 45-49. The attack's own norm
# preservation (apply_norm_preserving_directional_attack /
# generate_directional_attack_perturbation) is entirely unmodified and
# applies identically on every active round of every window -- intermittent
# scheduling only changes WHICH rounds are active, never HOW the attack is
# constructed on an active round. attack_strength_rho is deliberately
# absent (inert for this attack family, same convention as every existing
# directional config).
experiment_id: NDSS_E3_INTERMITTENT_DIRECTIONAL
experiment_name: ndss_e3_intermittent_directional_client002_seed123
dataset_config: configs/cifar100_data.yaml
output_dir: results_ndss/E3_intermittent/directional_client002_seed123
checkpoint_dir: checkpoints_ndss/E3_intermittent/directional_client002_seed123

num_clients: 5
clients_per_round: 5
minimum_updates: 5
communication_rounds: 50
local_epochs: 1
batch_size: 32
num_workers: 2

model: resnet18_cifar
num_classes: 100

optimizer: sgd
learning_rate: 0.01
momentum: 0.9
weight_decay: 0.0005
scheduler: none
mixed_precision: true

aggregation: fedavg
partition: dirichlet
dirichlet_alpha: 0.1
validation_fraction: 0.1
evaluate_every: 1
checkpoint_every: 1

seed: 123
device: auto
fail_round_on_client_error: true
continue_after_failed_round: false

attack_type: norm_preserving_directional
malicious_client_id: client_002
attack_start_round: 20
directional_target_cosine: 0.0
attack_active_windows:
  - [20, 24]
  - [30, 34]
  - [40, 44]
